name: Environment Checks

on:
  push:
  pull_request:

permissions:
  contents: read

# Keep job/check names stable for existing branch-protection consumers.
jobs:
  harness:
    name: harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Run environment regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/environment/tests/regression.py

  portability:
    name: portability (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run environment regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/environment/tests/regression.py
