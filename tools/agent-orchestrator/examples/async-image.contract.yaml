schema_version: 1

goal:
  id: candidate-image-goal
  title: Build an immutable Candidate image
  requirement: Verify the change and resolve its Candidate image to an immutable digest.
  acceptance:
    - id: AC-1
      statement: The approved behavior passes against the integrated Candidate.
    - id: AC-2
      statement: The Candidate image is identified by an immutable SHA-256 digest.

approval:
  status: approved
  approved_by: owner
  approved_at: 2026-07-15T00:00:00Z

agent:
  provider: codex

project:
  repo: /absolute/path/to/trusted/project
  base_ref: main

candidate:
  image_profile: pr-image

todo:
  id: T-1
  title: Implement and verify the Candidate behavior

test:
  command: [python3, -m, pytest, -q]
  allowed_paths: [tests/**]
  timeout_seconds: 900
