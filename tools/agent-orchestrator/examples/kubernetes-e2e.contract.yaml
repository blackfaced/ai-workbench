schema_version: 1

goal:
  id: kubernetes-e2e-goal
  title: Verify the Candidate in the development cluster
  requirement: The approved behavior works in an isolated non-production namespace.
  acceptance:
    - id: AC-1
      statement: The end-to-end integration gate passes against the Candidate.

approval:
  status: approved
  approved_by: owner
  approved_at: 2026-07-16T00:00:00Z

agent:
  provider: codex

project:
  repo: /absolute/path/to/trusted/project
  base_ref: main

todo:
  id: T-1
  title: Implement and verify the integration behavior

test:
  command: [python3, -m, pytest, -q, tests/e2e]
  allowed_paths: [tests/e2e/**]
  timeout_seconds: 1800
  harness: development
