schema_version: 1

goal:
  id: salutations-goal
  title: Add greeting and farewell behavior
  requirement: Expose independent greeting and farewell functions.
  acceptance:
    - id: AC-1
      statement: Greeting includes the supplied name.
    - id: AC-2
      statement: Farewell includes the supplied name.

approval:
  status: approved
  approved_by: owner
  approved_at: 2026-07-15T00:00:00Z

agent:
  provider: codex

project:
  repo: /absolute/path/to/trusted/project
  base_ref: main

todos:
  - id: T-1
    title: Implement the greeting behavior
    depends_on: []
    test_ids: [AC-1]
    test:
      command: [python3, -m, pytest, -q]
      allowed_paths: [tests/test_greeting.py]
      timeout_seconds: 600
  - id: T-2
    title: Implement the farewell behavior
    depends_on: []
    test_ids: [AC-2]
    test:
      command: [python3, -m, pytest, -q]
      allowed_paths: [tests/test_farewell.py]
      timeout_seconds: 600
