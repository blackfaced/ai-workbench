schema_version: 1
status: approved

project:
  root: /absolute/path/to/trusted/project
  trusted: true

capabilities:
  commands:
    browser_e2e:
      argv: [npx, playwright, test]
      approved: true
    serve_local:
      argv: [npm, run, dev]
      approved: true
    diagnose_browser:
      argv: [npx, -y, "@playwright/mcp@latest", --headless]
      approved: true
  skills: {}

harness:
  profiles:
    local-browser:
      kind: local_process
      environment: local
      browser_gate: playwright
      browser_diagnostic:
        adapter: playwright-mcp
        command: [npx, -y, "@playwright/mcp@latest", --headless]
        timeout_seconds: 120
      start:
        command: [npm, run, dev]
      ready:
        url: http://127.0.0.1:{port}/health
        timeout_seconds: 60
