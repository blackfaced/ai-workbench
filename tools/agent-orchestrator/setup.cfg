[metadata]
name = ai-workbench-agent-orchestrator
version = 0.1.0
description = A recoverable, test-first runner for unattended agent development
long_description = file: README.md
long_description_content_type = text/markdown

[options]
python_requires = >=3.9
package_dir =
    = src
packages = find:
install_requires =
    PyYAML>=6.0
    tomli>=2.0; python_version < "3.11"

[options.extras_require]
test =
    pytest>=8.3,<9; python_version < "3.10"
    pytest>=9.0; python_version >= "3.10"
    pytest-cov>=5,<7

[options.packages.find]
where = src

[options.package_data]
aiwb =
    recipes/*.yaml
    skills/*/SKILL.md

[options.entry_points]
console_scripts =
    aiwb = aiwb.cli:main
    aiwb-mcp = aiwb.mcp_server:main
