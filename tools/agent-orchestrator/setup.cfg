[metadata]
name = ai-workbench-agent-orchestrator
version = 0.1.0
description = A recoverable, test-first runner for unattended agent development
long_description = file: README.md
long_description_content_type = text/markdown

[options]
python_requires = >=3.9
package_dir =
    = src
packages = find:
install_requires =
    PyYAML>=6.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    aiwb = aiwb.cli:main
    aiwb-mcp = aiwb.mcp_server:main
